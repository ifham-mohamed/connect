services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobradar}
      POSTGRES_DB: jobradar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobradar -d jobradar"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: worker
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://jobradar:${POSTGRES_PASSWORD:-jobradar}@db:5432/jobradar
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      target: web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://jobradar:${POSTGRES_PASSWORD:-jobradar}@db:5432/jobradar
      APP_URL: ${APP_URL:-http://localhost:3000}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgresql://jobradar:${POSTGRES_PASSWORD:-jobradar}@db:5432/jobradar
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
volumes:
  postgres_data:
