services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobradar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobradar}
      POSTGRES_DB: jobradar
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobradar -d jobradar"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  migrate:
    build:
      context: .
      target: worker
    command: ["npm", "run", "db:migrate"]
    environment:
      DATABASE_URL: postgresql://jobradar:${POSTGRES_PASSWORD:-jobradar}@db:5432/jobradar
    depends_on:
      db:
        condition: service_healthy
  web:
    build:
      context: .
      target: web
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://jobradar:${POSTGRES_PASSWORD:-jobradar}@db:5432/jobradar
      APP_URL: ${APP_URL:-http://localhost:3000}
      CRON_SECRET: ${CRON_SECRET:?Set CRON_SECRET in .env}
      JEV_MODE: ${JEV_MODE:-off}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
  worker:
    build:
      context: .
      target: worker
    environment:
      DATABASE_URL: postgresql://jobradar:${POSTGRES_PASSWORD:-jobradar}@db:5432/jobradar
      JEV_MODE: ${JEV_MODE:-off}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["sh", "-c", "while true; do npm run sync; sleep 3600; done"]
    restart: unless-stopped
  intelligence:
    profiles: ["jev"]
    build:
      context: .
      target: worker
    command: ["npm", "run", "jev:worker"]
    environment:
      DATABASE_URL: postgresql://jobradar:${POSTGRES_PASSWORD:-jobradar}@db:5432/jobradar
      JEV_MODE: ${JEV_MODE:-shadow}
      JEV_PROVIDER: ${JEV_PROVIDER:-vercel}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      JEV_MODEL: ${JEV_MODEL:-typesafe-ai/jev}
      JEV_BASE_URL: ${JEV_BASE_URL:-}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      JEV_REQUEST_TIMEOUT_MS: ${JEV_REQUEST_TIMEOUT_MS:-10000}
      JEV_MAX_RETRIES: ${JEV_MAX_RETRIES:-2}
      JEV_MAX_ATTEMPTS: ${JEV_MAX_ATTEMPTS:-5}
      JEV_BATCH_SIZE: ${JEV_BATCH_SIZE:-5}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
volumes:
  postgres_data:
